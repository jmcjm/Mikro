name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

  build-apk:
    name: Build Android APK
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "==> Configuring release keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            cat << EOF > android/key.properties
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=app/release.jks
            EOF
          else
            echo "==> No release keystore secret found, falling back to debug signing"
          fi

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/pl.jmc.mikro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikro-apk
          path: dist/pl.jmc.mikro.apk

  build-appimage:
    name: Build Linux AppImage
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            desktop-file-utils \
            appstream \
            curl

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Linux bundle
        run: flutter build linux --release

      - name: Package AppImage
        run: ./packaging/build-appimage.sh --skip-bundle

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikro-appimage
          path: build/appimage/Mikro-x86_64.AppImage

  build-flatpak:
    name: Build Linux Flatpak
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux & Flatpak build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            desktop-file-utils \
            appstream \
            flatpak \
            flatpak-builder \
            elfutils

      - name: Set up Flatpak runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Linux bundle
        run: flutter build linux --release

      - name: Package Flatpak
        run: ./packaging/build-flatpak.sh --skip-bundle

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikro-flatpak
          path: build/flatpak/pl.jmc.mikro.flatpak

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-apk, build-appimage, build-flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mikro-apk
          path: release-assets/

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: mikro-appimage
          path: release-assets/

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: mikro-flatpak
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/pl.jmc.mikro.apk
            release-assets/Mikro-x86_64.AppImage
            release-assets/pl.jmc.mikro.flatpak
          generate_release_notes: true
