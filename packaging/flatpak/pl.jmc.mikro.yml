# Flatpak manifest for Mikro.
#
# Strategy: Flutter is built OUTSIDE flatpak-builder (e.g. in devcontainer/CI),
# and here the prepared bundle from build/linux/x64/release/bundle is packaged
# alongside desktop integration assets.
#
# Build: ./packaging/build-flatpak.sh (from repo root).
#
# Runtime: org.freedesktop.Platform 25.08 supplies all dependencies
# (gtk3, gstreamer with pulse/pipewire/playback plugins, libsecret, json-glib)
# and parecord/pactl/ffmpeg binaries used by record_linux.
app-id: pl.jmc.mikro
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: mikro

finish-args:
  # Native display session backend; fallback-x11 for non-Wayland sessions.
  - --socket=wayland
  - --socket=fallback-x11
  # Shared IPC (MIT-SHM shared memory) required by X11 backend.
  - --share=ipc
  # GPU acceleration for Flutter renderer.
  - --device=dri
  # Microphone capture (parecord) and playback (GStreamer) via PulseAudio / PipeWire.
  - --socket=pulseaudio
  # Network access for transcription and LLM API.
  - --share=network
  # connectivity_plus monitors NetworkManager over system D-Bus.
  - --system-talk-name=org.freedesktop.NetworkManager
  # flutter_secure_storage stores API keys in Secret Service (libsecret).
  - --talk-name=org.freedesktop.secrets

modules:
  - name: mikro
    buildsystem: simple
    build-commands:
      - install -d /app/mikro
      - cp -a bundle/. /app/mikro/
      - install -d /app/bin
      - ln -s ../mikro/mikro /app/bin/mikro
      - install -Dm644 shared/pl.jmc.mikro.desktop /app/share/applications/pl.jmc.mikro.desktop
      - install -Dm644 shared/pl.jmc.mikro.metainfo.xml /app/share/metainfo/pl.jmc.mikro.metainfo.xml
      - for size in 64 128 256 512; do install -Dm644 "icons/hicolor/${size}x${size}/apps/pl.jmc.mikro.png" "/app/share/icons/hicolor/${size}x${size}/apps/pl.jmc.mikro.png"; done
    sources:
      - type: dir
        path: ../../build/linux/x64/release/bundle
        dest: bundle
      - type: dir
        path: ../shared
        dest: shared
      - type: dir
        path: ../icons
        dest: icons
